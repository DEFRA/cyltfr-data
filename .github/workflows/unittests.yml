name: UNITTEST

on:
  push:
    # ignored to avoid duplicate runs as development is covered by build-pipeline.yml using this workflow
    branches-ignore:
      - development
  workflow_call:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      AWS_BUCKET_REGION: unittest
      AWS_BUCKET_NAME: unittest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of sonarcloud analysis
      - name: Use Node.js '22.x'
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Run unit tests
        run: |
          npm ci
          npm run test
          sed -i 's/\/home\/runner\/work\/cyltfr-data\/cyltfr-data\//\/github\/workspace\//g' test/output/lcov.info
      - name: Official SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}